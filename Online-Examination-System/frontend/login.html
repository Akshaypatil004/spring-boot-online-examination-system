<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Online Examination System">
  <title>Sign in | Exam Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg border-bottom bg-body">
      <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="index.html"><span class="brand-mark"><i class="bi bi-journal-check" aria-hidden="true"></i></span><span>Exam<span class="text-primary">Portal</span></span></a>
        <div class="d-flex align-items-center gap-2">
          <a class="nav-link" href="index.html">Home</a>
          <button class="btn btn-outline-secondary theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch theme"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i><span class="d-lg-none ms-2" data-theme-label>Dark theme</span></button>
        </div>
      </div>
    </nav>
  </header>
  <main class="auth-main py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
          <section class="auth-card">
            <div class="welcome-icon mb-4"><i class="bi bi-person-lock" aria-hidden="true"></i></div>
            <span class="section-label">WELCOME BACK</span>
            <h1 class="h2 fw-semibold mt-2">Sign in to your account</h1>
            <p class="text-body-secondary mb-4">Use your registered email and password to continue.</p>

            <div class="alert alert-info d-none" role="status" data-auth-notice></div>
            <div class="alert alert-danger d-none" role="alert" data-auth-error></div>

            <form data-login-form novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input class="form-control form-control-lg" type="email" id="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" aria-describedby="email-error">
                <div class="invalid-feedback" id="email-error">Enter a valid email address.</div>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="password-error">
                <div class="invalid-feedback" id="password-error">Enter your password.</div>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit" data-login-submit>
                <span data-submit-label>Sign in</span><span class="spinner-border spinner-border-sm ms-2 d-none" aria-hidden="true" data-submit-spinner></span>
              </button>
            </form>
          </section>
          <p class="text-center text-body-secondary small mt-4">Your session is stored only for this browser tab.</p>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer border-top py-4"><div class="container text-center"><p class="small text-body-secondary mb-0">&copy; <span data-current-year></span> Online Examination System</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/common.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
