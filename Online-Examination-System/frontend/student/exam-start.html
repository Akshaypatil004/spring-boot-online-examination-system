  <header><nav class="navbar border-bottom bg-body"><div class="container"><a class="navbar-brand fw-semibold" href="dashboard.html">Exam<span class="text-primary">Portal</span></a><div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch theme"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i><span class="d-lg-none ms-2" data-theme-label>Dark theme</span></button><button class="btn btn-primary" type="button" data-logout>Sign out</button></div></div></nav></header>
